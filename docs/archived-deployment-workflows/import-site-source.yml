name: Prepare GitHub-owned NBHandel source (one-time, branch only)

on:
  push:
    branches:
      - nbh-github-owned-site-20261024
    paths:
      - .github/workflows/import-site-source.yml

permissions:
  contents: write

concurrency:
  group: nbh-site-import-20261024
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/nbh-github-owned-site-20261024'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated migration branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Freeze existing PUBLIC production pages and owned assets
        run: python3 tools/import_live_snapshot.py
      - name: Verify product finder not accidentally activated
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/datenschutz.html
          test -s site/transparenz.html
          test -s site/angebotsvergleich.html
          test -s site/produkte.html
          test -s site/vendor/webflow/6abedad969a74cbc62fc1fbe/css/nbhandel-16b9f2.webflow.shared.a60608b14.css
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('docs/github-live-source-manifest.json').read_text())
          assert m['route_count']==58
          assert m['verified_no_broken_owned_assets']
          assert m['local_subresource_integrity_tags_recomputed']>=57
          print('SOURCE_IMPORT_VERIFIED',m['files'],m['bytes'])
          PY
      - name: Commit snapshot ONLY to non-live migration branch
        run: |
          set -euo pipefail
          git config user.name "NBHandel source migration"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- site docs/github-live-source-manifest.json
          if git diff --cached --quiet; then
            echo 'No source changes'
          else
            git commit -m "Snapshot current public site as self-contained GitHub source [skip ci]"
            git push origin HEAD:nbh-github-owned-site-20261024
          fi
