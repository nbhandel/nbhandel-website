name: Sync NBHandel live v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nbhandel-live-v2
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build live site
        shell: bash
        run: |
          set -euo pipefail
          B=https://nbhandel-16b9f2.webflow.io
          rm -rf _site && mkdir _site
          curl -fsSL --retry 3 "$B/" -o _site/index.html
          R="tools produkte ratgeber kontakt themen methodik transparenz unternehmen impressum datenschutz ean-gtin-pruefen barcode-scanner gesamtpreisrechner stueck-grundpreis rabattrechner preisaenderung bundle-vergleich versandfreigrenze kosten-pro-nutzung stromkostenrechner break-even angebotsvergleich kaufcheck finanzierungs-gesamtbetrag cashback-gutschein abo-kosten brutto-netto link-bereiniger angebots-check rueckgabe-serviceplaner deal-check produktpass preisbeobachtung ratgeber-bewertungen ratgeber-rabatte ratgeber-preisverlauf ratgeber-versandkosten ratgeber-ruecksendekosten ratgeber-garantie-gewaehrleistung ratgeber-verfuegbarkeit ratgeber-kaufentscheidung ratgeber-marktplatz-haendler ratgeber-finanzierung ratgeber-preisschwankungen ratgeber-gesamtpreis ratgeber-produktidentitaet ratgeber-zustand ratgeber-bundles ratgeber-haendlervertrauen produkte-technik-elektronik produkte-haushalt-wohnen produkte-beauty-pflege produkte-sport-freizeit produkte-sammeln-hobby produkte-buero-papier produkte-tierbedarf partner"
          for r in $R; do curl -fsSL --retry 3 "$B/$r" -o "_site/$r.html"; done
          curl -fsSL --retry 3 "$B/404" -o _site/404.html || cp _site/index.html _site/404.html
          for f in _site/*.html; do sed -i -e 's#https://nbhandel-16b9f2\.webflow\.io#https://nbhandel.de#g' -e 's#lang="en"#lang="de"#g' -e 's#data-wf-status="1"#data-wf-status="0"#g' "$f"; done
          printf 'nbhandel.de\n' > _site/CNAME
          touch _site/.nojekyll
          [ ! -d .well-known ] || cp -R .well-known _site/.well-known
          printf 'User-agent: *\nAllow: /\n' > _site/robots.txt
          test -s _site/index.html
          test -s _site/produkte.html
          test -s _site/partner.html
      - name: Publish native favicon files
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import struct
          import urllib.request
          from html.parser import HTMLParser
          from pathlib import Path

          class Icons(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.items = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'link' and attrs.get('rel') in ('icon', 'apple-touch-icon'):
                      self.items.append(attrs)

          site = Path('_site')
          parser = Icons()
          parser.feed((site / 'index.html').read_text())
          urls, images = {}, {}
          for icon in parser.items:
              url = icon['href']
              size = int(icon['sizes'].split('x')[0])
              kind = icon['rel']
              if url not in urls:
                  if not url.startswith('https://cdn.prod.website-files.com/'):
                      raise RuntimeError('Unexpected favicon source: ' + url)
                  with urllib.request.urlopen(url, timeout=30) as response:
                      data = response.read()
                  if data[:8] != b'\x89PNG\r\n\x1a\n' or struct.unpack('>II', data[16:24]) != (size, size):
                      raise RuntimeError('Invalid favicon PNG or dimensions: ' + url)
                  name = 'apple-touch-icon.png' if kind == 'apple-touch-icon' else f'favicon-{size}.png'
                  (site / name).write_bytes(data)
                  version = hashlib.sha256(data).hexdigest()[:12]
                  urls[url] = f'/{name}?v={version}'
                  images[(kind, size)] = data

          for key in [('icon', 32), ('icon', 48), ('apple-touch-icon', 180)]:
              if key not in images:
                  raise RuntimeError('Required favicon missing: ' + str(key))
          frames = [(size, images[('icon', size)]) for size in (32, 48)]
          offset = 6 + 16 * len(frames)
          ico = struct.pack('<HHH', 0, 1, len(frames))
          for size, data in frames:
              ico += struct.pack('<BBBBHHII', size, size, 0, 0, 1, 32, len(data), offset)
              offset += len(data)
          ico += b''.join(data for _, data in frames)
          (site / 'favicon.ico').write_bytes(ico)
          (site / 'apple-touch-icon-precomposed.png').write_bytes(images[('apple-touch-icon', 180)])

          # Preserve each page's markup; change only its existing icon URLs.
          count = 0
          for page in site.glob('*.html'):
              html = page.read_text()
              for source, local in urls.items():
                  html = html.replace(source, local)
              page.write_text(html)
              count += 1
          print(f'Published {len(urls)} native PNG icons, favicon.ico and Apple fallback for {count} pages.')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
