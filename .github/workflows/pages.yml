name: Deploy NBHandel Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production site from current Webflow staging
        shell: bash
        run: |
          set -euo pipefail
          STAGING="https://nbhandel-16b9f2.webflow.io"
          rm -rf _site
          mkdir -p _site

          routes=(
            ""
            "tools"
            "ratgeber"
            "kontakt"
            "themen"
            "methodik"
            "transparenz"
            "unternehmen"
            "impressum"
            "datenschutz"
            "ean-gtin-pruefen"
            "barcode-scanner"
            "gesamtpreisrechner"
            "stueck-grundpreis"
            "rabattrechner"
            "preisaenderung"
            "bundle-vergleich"
            "versandfreigrenze"
            "kosten-pro-nutzung"
            "stromkostenrechner"
            "break-even"
            "angebotsvergleich"
            "kaufcheck"
            "finanzierungs-gesamtbetrag"
            "cashback-gutschein"
            "abo-kosten"
            "brutto-netto"
            "link-bereiniger"
            "angebots-check"
            "rueckgabe-serviceplaner"
            "deal-check"
            "produktpass"
            "preisbeobachtung"
            "ratgeber-bewertungen"
            "ratgeber-rabatte"
            "ratgeber-preisverlauf"
            "ratgeber-versandkosten"
            "ratgeber-ruecksendekosten"
            "ratgeber-garantie-gewaehrleistung"
            "ratgeber-verfuegbarkeit"
            "ratgeber-kaufentscheidung"
            "ratgeber-marktplatz-haendler"
            "ratgeber-finanzierung"
            "ratgeber-preisschwankungen"
            "ratgeber-gesamtpreis"
            "ratgeber-produktidentitaet"
            "ratgeber-zustand"
            "ratgeber-bundles"
            "ratgeber-haendlervertrauen"
            "produkte-technik-elektronik"
            "produkte-haushalt-wohnen"
            "produkte-beauty-pflege"
            "produkte-sport-freizeit"
            "produkte-sammeln-hobby"
            "produkte-buero-papier"
            "produkte-tierbedarf"
            "partner"
          )

          for route in "${routes[@]}"; do
            if [ -z "$route" ]; then
              url="$STAGING/"
              out="_site/index.html"
            else
              url="$STAGING/$route"
              out="_site/$route.html"
            fi

            echo "Fetching $url -> $out"
            curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 90 "$url" --output "$out"

            sed -i               -e 's#https://nbhandel-16b9f2\.webflow\.io#https://nbhandel.de#g'               -e 's#http://nbhandel-16b9f2\.webflow\.io#https://nbhandel.de#g'               -e 's#lang="en"#lang="de"#g'               -e 's#data-wf-status="1"#data-wf-status="0"#g'               "$out"
          done

          curl --fail --location --retry 3 --retry-delay 2 "$STAGING/404" --output "_site/404.html" || cp "_site/index.html" "_site/404.html"
          sed -i             -e 's#https://nbhandel-16b9f2\.webflow\.io#https://nbhandel.de#g'             -e 's#lang="en"#lang="de"#g'             -e 's#data-wf-status="1"#data-wf-status="0"#g'             "_site/404.html"

          printf 'nbhandel.de\n' > _site/CNAME
          touch _site/.nojekyll

          if [ -d .well-known ]; then
            cp -R .well-known _site/.well-known
          fi

          cat > _site/robots.txt && echo "Done replacing content"
