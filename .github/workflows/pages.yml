name: "NBHandel | Webflow-Vorschau → GitHub Pages"

# Bought Webflow design is the visual authoring/staging source.
# The existing GitHub site/ tree is kept untouched as a recovery copy.
# Never deploy automatically from a push or directly from Webflow edits.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "preview = nur prüfen; publish = Webflow live schalten; restore = GitHub-Sicherung"
        type: choice
        required: true
        default: preview
        options:
          - preview
          - publish
          - restore-github-backup

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nbh-github-pages-production
  cancel-in-progress: false

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout preserved source and recovery baseline
        uses: actions/checkout@v4

      - name: Prepare and verify exactly one website version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.operation }}" = "restore-github-backup" ]; then
            cp -a site _site
            echo "Using the frozen GitHub recovery baseline."
          else
            python3 tools/build_webflow_release.py
          fi
          python3 tools/verify_site.py _site
          test -s _site/index.html
          test -s _site/datenschutz.html
          test -s _site/impressum.html
          test -s _site/transparenz.html
          echo "Prepared snapshot verified. No production change yet."

      - name: Save the exact prepared website for review and recovery
        uses: actions/upload-artifact@v4
        with:
          name: nbh-website-${{ inputs.operation }}-${{ github.run_number }}
          path: _site/
          include-hidden-files: true
          retention-days: 30

      - name: Configure free GitHub Pages hosting
        if: ${{ inputs.operation != 'preview' }}
        uses: actions/configure-pages@v5

      - name: Upload approved website to GitHub Pages
        if: ${{ inputs.operation != 'preview' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          include-hidden-files: true

      - name: Publish only after explicit release selection
        if: ${{ inputs.operation != 'preview' }}
        id: deployment
        uses: actions/deploy-pages@v4
