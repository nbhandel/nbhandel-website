name: Deploy NBHandel Pages from GitHub source

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'tools/verify_site.py'
      - 'docs/github-live-source-manifest.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nbh-github-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout immutable GitHub source
        uses: actions/checkout@v4
      - name: Check public source (no Webflow/affiliate API access)
        run: python3 tools/verify_site.py site
      - name: Assemble production files strictly from this commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -a site/. _site/
          test -s _site/index.html
          test -s _site/datenschutz.html
          test -s _site/transparenz.html
          test -s _site/impressum.html
          test "$(cat _site/CNAME)" = nbhandel.de
          test -f _site/.nojekyll
          echo 'Production source is GitHub checkout site/. No Webflow fetch.'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
