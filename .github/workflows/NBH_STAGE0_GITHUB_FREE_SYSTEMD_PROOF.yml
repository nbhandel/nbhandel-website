name: NBH one-off systemd restore proof
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nbh-rule85-disposable-proof-only
  cancel-in-progress: false
jobs:
  real-systemd:
    if: github.ref == 'refs/heads/nbh-rule85-proof-20261015'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Actual GateSigner A manager and reboot on isolated GitHub guest
        shell: bash
        run: |
          #!/usr/bin/env bash
          set -Eeuo pipefail
          : "${RUNNER_TEMP:?}"
          [[ "${GITHUB_ACTIONS:-}" == true && "${RUNNER_ENVIRONMENT:-}" == github-hosted ]] || { echo BLOCKED_GITHUB_RUNNER_ONLY; exit 77; }
          [[ "${GITHUB_REF_NAME:-}" == nbh-rule85-proof-20261015 ]] || { echo BLOCKED_EXACT_PROOF_BRANCH_REQUIRED; exit 77; }
          [[ "$(hostname -s)" != nbh-lab-f01 && ! -e /srv/nbh ]] || { echo BLOCKED_NBH_SERVER_PRESENT; exit 77; }
          work="$(mktemp -d "$RUNNER_TEMP/nbh-rule85-XXXXXX")"
          proof_dir="$RUNNER_TEMP/nbh-rule85-evidence"
          mkdir -p "$proof_dir"
          cleanup(){
            local p
            if [[ -s "$work/qemu.pid" ]]; then
              p="$(cat "$work/qemu.pid")"
              if [[ "$p" =~ ^[0-9]+$ ]] && kill -0 "$p" 2>/dev/null; then
                kill "$p" || :
              fi
            fi
          }
          trap cleanup EXIT
          
          # The byte-exact reviewed guest fixture is embedded in this test branch workflow.
          cat > "$work/NBH_MAIN_GATEKEEPER_A_DISPOSABLE_SYSTEMD_REBOOT_PROBE_20261015.sh" <<'NBH_REVIEWED_PROBE'
          #!/usr/bin/env bash
          # NBH_MAIN 2026-10-15: Disposable-only real systemd PID1 + reboot proof.
          # NEVER execute on nbh-lab-f01 or a production host. No actual NBH keys or data.
          set -Eeuo pipefail
          
          EXPECTED_HOST='nbh-rule85-fixture-20261015'
          STATE='/var/lib/nbh-rule85-fixture-proof'
          UNIT='nbh-rule85-fixture.service'
          UNIT_FILE="/etc/systemd/system/$UNIT"
          DROP_DIR="/etc/systemd/system/$UNIT.d"
          DROP="$DROP_DIR/91-nbh-gatekeeper-v4.conf"
          RESUME_UNIT='nbh-rule85-fixture-resume.service'
          RESUME_FILE="/etc/systemd/system/$RESUME_UNIT"
          SCRIPT='/root/NBH_MAIN_GATEKEEPER_A_DISPOSABLE_SYSTEMD_REBOOT_PROBE_20261015.sh'
          DUMMY="/etc/nbh/rulegate/gate_signer.ed25519"
          EXACT_A_DROP_SHA="6fcd56250d01f67f5d5160023f3fde37c664ac7d4222a7e0ee34dc7fd771fd1d"
          
          blocked() { printf 'BLOCKED: %s\n' "$*" >&2; exit 77; }
          require() { "$@" || blocked "REQUIRE_FAILED:$*"; }
          
          # Fail closed even if a user accidentally pastes this into the live LAB console.
          [[ "$(id -u)" == 0 ]] || blocked 'NOT_ROOT'
          [[ "$(hostname -s)" == "$EXPECTED_HOST" ]] || blocked 'NOT_EXACT_DISPOSABLE_HOST'
          [[ "$(ps -p 1 -o comm= | xargs)" == systemd ]] || blocked 'PID1_NOT_SYSTEMD'
          [[ ! -e /srv/nbh ]] || blocked 'NBH_PROJECT_PRESENT_NEVER_EXECUTE'
          [[ "$(readlink -f "$0")" == "$SCRIPT" ]] || blocked 'SCRIPT_PATH_NOT_EXACT'
          [[ "$0" != *$'\n'* ]] || blocked 'SCRIPT_PATH_INVALID'
          command -v python3 >/dev/null || blocked 'PYTHON3_MISSING'
          command -v systemctl >/dev/null || blocked 'SYSTEMCTL_MISSING'
          
          report() {
            local mode="$1" result="$2"; shift 2
            python3 - "$STATE" "$mode" "$result" "$@" <<'PY'
          import datetime,hashlib,json,os,pathlib,sys,tempfile
          folder=pathlib.Path(sys.argv[1]); phase=sys.argv[2]; outcome=sys.argv[3]; vals=sys.argv[4:]
          obj={"schema":"nbh-rule85-disposable-systemd-proof/1","phase":phase,
               "result":outcome,"recorded_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
               "hostname":os.uname().nodename,"values":dict(v.split('=',1) for v in vals),
               "probe_sha256":hashlib.sha256(pathlib.Path('/root/NBH_MAIN_GATEKEEPER_A_DISPOSABLE_SYSTEMD_REBOOT_PROBE_20261015.sh').read_bytes()).hexdigest()}
          target=folder / (phase+'.json');tmp=folder / ('.'+phase+'.tmp')
          with tmp.open('w') as f:
           json.dump(obj,f,sort_keys=True,indent=2);f.write('\n');f.flush();os.fsync(f.fileno())
          os.replace(tmp,target)
          fd=os.open(str(folder),os.O_RDONLY|os.O_DIRECTORY)
          try:os.fsync(fd)
          finally:os.close(fd)
          print(json.dumps({"phase":phase,"result":outcome,"file":str(target)},sort_keys=True))
          PY
          }
          
          property() { systemctl show "$UNIT" "-p$1" --value; }
          expect_not_running() { [[ "$(property ActiveState)" != active ]] || blocked 'FIXTURE_UNEXPECTEDLY_ACTIVE'; }
          expect_blocked_start() {
            if systemctl start "$UNIT" >/dev/null 2>&1; then blocked 'FAIL_OPEN_START_WAS_ALLOWED'; fi
            expect_not_running
          }
          
          phase1() {
            [[ ! -e "$STATE" && ! -e "$UNIT_FILE" && ! -e "$DROP_DIR" && ! -e "$RESUME_FILE" && ! -e /etc/nbh ]] || blocked 'PRIOR_TEST_ARTIFACTS_EXISTS'
            mkdir -m 0755 "$STATE"
            mkdir -m 0755 /etc/nbh /etc/nbh/rulegate
            printf 'DISPOSABLE_FIXTURE_MARKER_NOT_A_KEY\n' > "$DUMMY"
            chmod 0644 "$DUMMY"
            printf '[Unit]\nDescription=NBH disposable deny-only systemd fixture\n[Service]\nType=simple\nUser=nobody\nExecStart=/usr/bin/bash -c "test ! -r %s && exec /usr/bin/sleep infinity"\nRestart=always\nRestartSec=2\n[Install]\nWantedBy=multi-user.target\n' "$DUMMY" > "$UNIT_FILE"
            mkdir -m 0755 "$DROP_DIR"
            printf '[Unit]\nRefuseManualStart=yes\n[Service]\nInaccessiblePaths=/etc/nbh/rulegate/gate_signer.ed25519\nExecStartPre=/usr/bin/false\n' > "$DROP"
            [[ "$(sha256sum "$DROP" | cut -d' ' -f1)" == "$EXACT_A_DROP_SHA" ]] || blocked 'A_EXACT_BLOCK_UNIT_SHA_MISMATCH'
            printf '[Unit]\nDescription=NBH disposable reboot phase-2 proof\nAfter=local-fs.target\nConditionPathExists=%s/phase1.json\n[Service]\nType=oneshot\nExecStart=/usr/bin/bash %s phase2\n[Install]\nWantedBy=multi-user.target\n' "$STATE" "$SCRIPT" > "$RESUME_FILE"
            systemctl daemon-reload
            systemctl enable "$UNIT" "$RESUME_UNIT" >/dev/null
            [[ "$(property RefuseManualStart)" == yes ]] || blocked 'DENY_FLAG_NOT_LOADED'
            [[ "$(property UnitFileState)" == enabled ]] || blocked 'FIXTURE_NOT_ENABLED_FOR_BOOT'
            expect_blocked_start
            systemctl daemon-reexec
            [[ "$(property RefuseManualStart)" == yes ]] || blocked 'DENY_FLAG_LOST_AFTER_REEXEC'
            expect_blocked_start
            local boot="$(cat /proc/sys/kernel/random/boot_id)"
            report phase1 PASS "first_boot_id=$boot" "unit_sha256=$(sha256sum "$UNIT_FILE" | cut -d' ' -f1)" "deny_dropin_sha256=$(sha256sum "$DROP" | cut -d' ' -f1)" 'manual_start_denied=true' 'manager_reexec_denied=true' 'exact_A_barrier_bytes=true' 'real_reboot_pending=true'
            sync
            echo 'PHASE1_PASS: real systemd PID1 denies blocked fixture before and after daemon-reexec'
            echo 'REAL_REBOOT_SCHEDULED: reconnect to disposable console after ~60 seconds; read the FINAL report'
            # Reboot is issued only on this explicitly named disposable VM, after script exits.
            systemd-run --unit=nbh-rule85-fixture-reboot --on-active=12s /usr/bin/systemctl reboot >/dev/null
          }
          
          phase2() {
            [[ -f "$STATE/phase1.json" && ! -f "$STATE/phase2.json" ]] || blocked 'PHASE2_STATE_MISMATCH'
            local first now active state
            first="$(python3 -c 'import json;print(json.load(open("/var/lib/nbh-rule85-fixture-proof/phase1.json"))["values"]["first_boot_id"])')"
            now="$(cat /proc/sys/kernel/random/boot_id)"
            [[ -n "$first" && "$first" != "$now" ]] || blocked 'REAL_REBOOT_NOT_PROVEN'
            [[ "$(property RefuseManualStart)" == yes ]] || blocked 'DENY_FLAG_LOST_AFTER_REBOOT'
            expect_not_running
            expect_blocked_start
            # Confirm the fake key is readable in the unisolated guest; only systemd masks it.
            require test -r "$DUMMY"
            printf '[Unit]\nRefuseManualStart=no\n[Service]\nInaccessiblePaths=%s\nExecStartPre=/usr/bin/false\n' "$DUMMY" > "$DROP"
            systemctl daemon-reload
            systemctl reset-failed "$UNIT" >/dev/null 2>&1 || true
            expect_blocked_start
            printf '[Unit]\nRefuseManualStart=no\n[Service]\nInaccessiblePaths=%s\nExecStartPre=/usr/bin/true\n' "$DUMMY" > "$DROP"
            systemctl daemon-reload
            systemctl reset-failed "$UNIT" >/dev/null 2>&1 || true
            systemctl start "$UNIT"
            sleep 2
            [[ "$(property ActiveState)" == active ]] || blocked 'VALID_GUARD_DID_NOT_RUN'
            systemctl stop "$UNIT"
            [[ "$(property ActiveState)" != active ]] || blocked 'FIXTURE_DID_NOT_STOP'
            report phase2 PASS "first_boot_id=$first" "second_boot_id=$now" 'blocked_after_real_reboot=true' 'bad_start_guard_denied=true' 'good_start_guard_allowed=true' 'dummy_key_mounted_inaccessible=true'
            # Cleanup only the exact disposable fixture units; keep attestable JSON facts.
            systemctl disable "$UNIT" "$RESUME_UNIT" >/dev/null 2>&1 || true
            rm -f -- "$UNIT_FILE" "$DROP" "$RESUME_FILE" "$DUMMY"
            rmdir -- "$DROP_DIR" /etc/nbh/rulegate /etc/nbh
            systemctl daemon-reload
            systemctl reset-failed "$UNIT" >/dev/null 2>&1 || true
            report final PASS "first_boot_id=$first" "second_boot_id=$now" 'real_reboot_verified=true' 'deny_barrier_after_reboot=true' 'bad_guard_denied=true' 'good_guard_started=true' 'fixture_units_removed=true' 'dummy_key_removed=true' 'lab_host_touched=false'
            printf '\nFINAL_PROOF_OUTPUT_START\n'
            cat "$STATE/final.json"
            printf 'FINAL_PROOF_OUTPUT_END\n'
          }
          
          case "${1:-}" in
            phase1) phase1 ;;
            phase2) phase2 ;;
            *) blocked 'PHASE_MUST_BE_phase1_OR_phase2' ;;
          esac
          NBH_REVIEWED_PROBE
          [[ "$(sha256sum "$work/NBH_MAIN_GATEKEEPER_A_DISPOSABLE_SYSTEMD_REBOOT_PROBE_20261015.sh" | cut -d' ' -f1)" == "e68198528757a1b8f28f7182d626f563d8440c2e9d39627de0986bda2eb52146" ]] || { echo BLOCKED_PROBE_BYTE_DRIFT; exit 77; }
          printf 'A_SCRIPT_SHA256=%s\nA_EXACT_BARRIER_SHA256=6fcd56250d01f67f5d5160023f3fde37c664ac7d4222a7e0ee34dc7fd771fd1d\n' 'e68198528757a1b8f28f7182d626f563d8440c2e9d39627de0986bda2eb52146' > "$proof_dir/source_pins.txt"
          
          # Entirely GitHub-hosted ephemeral runner; no checkout, no NBH credentials, no cloud provider account.
          sudo apt-get update -qq >/dev/null
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq qemu-system-x86 qemu-utils cloud-image-utils >/dev/null
          command -v qemu-system-x86_64
          command -v cloud-localds
          command -v ssh-keygen
          
          src='https://cloud-images.ubuntu.com/noble/current'
          curl --fail --silent --show-error --location --retry 2 "$src/SHA256SUMS" -o "$work/SHA256SUMS"
          curl --fail --silent --show-error --location --retry 2 "$src/noble-server-cloudimg-amd64.img" -o "$work/base.img"
          cloud_sha="$(awk '$2 == "*noble-server-cloudimg-amd64.img" || $2 == "noble-server-cloudimg-amd64.img" {print $1; exit}' "$work/SHA256SUMS")"
          [[ "$cloud_sha" =~ ^[0-9a-f]{64}$ ]] || { echo BLOCKED_CLOUD_IMAGE_CHECKSUM_MISSING; exit 77; }
          printf '%s  %s\n' "$cloud_sha" "$work/base.img" | sha256sum --check --status || { echo BLOCKED_CLOUD_IMAGE_HASH; exit 77; }
          printf 'GUEST_IMAGE_SHA256=%s\n' "$cloud_sha" >> "$proof_dir/source_pins.txt"
          qemu-img create -q -f qcow2 -F qcow2 -b "$work/base.img" "$work/overlay.qcow2" 8G
          ssh-keygen -q -t ed25519 -N '' -f "$work/guestkey"
          export WORK="$work"
          python3 - <<'PYCODE'
          import base64, json, os, pathlib
          work=pathlib.Path(os.environ['WORK'])
          probe=base64.b64encode((work/'NBH_MAIN_GATEKEEPER_A_DISPOSABLE_SYSTEMD_REBOOT_PROBE_20261015.sh').read_bytes()).decode()
          sshpub=(work/'guestkey.pub').read_text().strip()
          assert sshpub.startswith('ssh-ed25519 ')
          meta='instance-id: nbh-rule85-gh-actions-once\nlocal-hostname: nbh-rule85-fixture-20261015\n'
          (work/'meta-data').write_text(meta)
          scriptpath='/root/NBH_MAIN_GATEKEEPER_A_DISPOSABLE_SYSTEMD_REBOOT_PROBE_20261015.sh'
          cloud='\n'.join([
           '#cloud-config',
           'hostname: nbh-rule85-fixture-20261015',
           'manage_etc_hosts: true',
           'ssh_pwauth: false',
           'disable_root: true',
           'users:',
           '  - name: nbhci',
           '    groups: [sudo]',
           '    shell: /bin/bash',
           '    lock_passwd: true',
           '    sudo: ["ALL=(ALL) NOPASSWD:ALL"]',
           '    ssh_authorized_keys:',
           '      - '+sshpub,
           'write_files:',
           '  - path: '+scriptpath,
           '    owner: root:root',
           '    permissions: "0700"',
           '    encoding: b64',
           '    content: '+probe,
           'runcmd:',
           '  - ["/usr/bin/bash", "'+scriptpath+'", "phase1"]',
           ''])
          (work/'user-data').write_text(cloud)
          PYCODE
          cloud-localds "$work/seed.iso" "$work/user-data" "$work/meta-data"
          
          # Prefer accelerated KVM when available; fail-closed logs if the isolated guest cannot boot.
          if [[ -c /dev/kvm ]]; then
            sudo chmod 0666 /dev/kvm
            accel=(-accel kvm -cpu host)
          else
            accel=(-accel tcg,thread=multi -cpu max)
          fi
          qemu-system-x86_64 -machine q35 "${accel[@]}" -m 1536 -smp 2 \
            -drive "file=$work/overlay.qcow2,format=qcow2,if=virtio" \
            -drive "file=$work/seed.iso,format=raw,media=cdrom,if=virtio" \
            -netdev user,id=net0,hostfwd=tcp:127.0.0.1:2222-:22 \
            -device virtio-net-pci,netdev=net0 -device virtio-rng-pci \
            -display none -serial "file:$work/guest-serial.log" -monitor none \
            -pidfile "$work/qemu.pid" -daemonize
          [[ -s "$work/qemu.pid" ]] || { echo BLOCKED_GUEST_NOT_STARTED; exit 77; }
          sshopt=(-o BatchMode=yes -o ConnectTimeout=3 -o ServerAliveInterval=4 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$work/guestkey" -p 2222)
          ready=0
          for _ in $(seq 1 160); do
            if ssh "${sshopt[@]}" nbhci@127.0.0.1 sudo -n test -s /var/lib/nbh-rule85-fixture-proof/final.json </dev/null >/dev/null 2>&1; then
              ready=1; break
            fi
            if ! kill -0 "$(cat "$work/qemu.pid")" 2>/dev/null; then
              echo BLOCKED_GUEST_EXITED_BEFORE_FINAL
              break
            fi
            sleep 6
          done
          if [[ "$ready" != 1 ]]; then
            echo BLOCKED_TRUE_REBOOT_PROOF_NOT_COMPLETED
            tail -n 100 "$work/guest-serial.log" > "$proof_dir/guest_serial_tail.txt" || :
            cat "$proof_dir/guest_serial_tail.txt"
            exit 78
          fi
          for name in phase1 phase2 final; do
            ssh "${sshopt[@]}" nbhci@127.0.0.1 "sudo -n cat /var/lib/nbh-rule85-fixture-proof/$name.json" > "$proof_dir/$name.json"
          done
          ssh "${sshopt[@]}" nbhci@127.0.0.1 'cat /proc/1/comm' > "$proof_dir/guest_pid1.txt"
          python3 - "$proof_dir" <<'PYCODE'
          import json,sys,pathlib
          p=pathlib.Path(sys.argv[1]); a=json.loads((p/'phase1.json').read_text());b=json.loads((p/'phase2.json').read_text());c=json.loads((p/'final.json').read_text())
          expected='e68198528757a1b8f28f7182d626f563d8440c2e9d39627de0986bda2eb52146'
          assert (p/'guest_pid1.txt').read_text().strip()=='systemd', 'NOT_REAL_GUEST_SYSTEMD'
          assert all(v.get('result')=='PASS' and v.get('hostname')=='nbh-rule85-fixture-20261015' for v in [a,b,c]),'BAD_GUEST_RESULT'
          assert all(v.get('probe_sha256')==expected for v in [a,b,c]),'BAD_PROBE_SHA'
          assert a['values']['first_boot_id'] != b['values']['second_boot_id'], 'SAME_BOOT_ID'
          assert a['values']['first_boot_id'] == b['values']['first_boot_id'], 'BOOT_SOURCE_MISMATCH'
          assert c['values']['first_boot_id'] == a['values']['first_boot_id'] and c['values']['second_boot_id'] == b['values']['second_boot_id'], 'FINAL_BOOT_SOURCE_MISMATCH'
          for fld in ('manager_reexec_denied','exact_A_barrier_bytes'):
           assert a['values'][fld]=='true', fld
          for fld in ('blocked_after_real_reboot','bad_start_guard_denied','good_start_guard_allowed'):
           assert b['values'][fld]=='true', fld
          for fld in ('real_reboot_verified','deny_barrier_after_reboot','fixture_units_removed','dummy_key_removed','lab_host_touched'):
           assert c['values'][fld]==('false' if fld=='lab_host_touched' else 'true'), fld
          print('PASS_GATEKEEPER_A_GITHUB_EPHEMERAL_GUEST_TRUE_REBOOT')
          print('FIRST_BOOT_ID',a['values']['first_boot_id'])
          print('SECOND_BOOT_ID',b['values']['second_boot_id'])
          PYCODE
          printf '%s\n' 'ACTUAL_DISPOSABLE_PROOF:'
          cat "$proof_dir/final.json"
          printf '\nPROOF_FILE_HASHES:\n'
          sha256sum "$proof_dir"/*
      - name: Save independent proof JSON (never secrets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nbh-rule85-disposable-guest-evidence
          path: ${{ runner.temp }}/nbh-rule85-evidence/
          retention-days: 7
          if-no-files-found: warn
